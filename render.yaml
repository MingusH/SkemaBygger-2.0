# Render Blueprint — https://render.com/docs/blueprint-spec
# Creates: a Postgres DB, the backend (API + MCP + OAuth) web service, and the frontend
# static site. After the first deploy, fill in the three `sync: false` URL env vars
# (their values depend on the assigned *.onrender.com hostnames). See DEPLOY.md.

databases:
  - name: skemabygger-db
    plan: free

services:
  # ── Backend: FastAPI + MCP server + OAuth (one web service) ────────────────
  - type: web
    name: skemabygger-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: skemabygger-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true        # Render generates a strong secret
      - key: SOLVER_NUM_WORKERS
        value: "1"                 # safe for the free fractional CPU
      - key: PUBLIC_BASE_URL
        sync: false                # set to this service's URL, e.g. https://skemabygger-api.onrender.com
      - key: CORS_ORIGINS
        sync: false                # set to the frontend URL, e.g. https://skemabygger-web.onrender.com

  # ── Frontend: built Vite SPA, served as a free static site ─────────────────
  - type: web
    name: skemabygger-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html   # SPA client-side routing
    envVars:
      - key: VITE_API_BASE_URL
        sync: false                # set to the backend URL + /api, e.g. https://skemabygger-api.onrender.com/api
